<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stride Focus: C, Stage</title>
<style>
/* ---------- Stride Soft UI tokens ---------- */
:root {
  color-scheme: light;
  --bg: #F0F4F8;
  --sidebar: #EAEEF5;
  --surface: #FFFFFF;
  --well: #E9EEF4;
  --shadow-light: #FFFFFF;
  --shadow-dark: #D1D9E6;
  --fg: #1F2937;
  --muted: #4B5563;
  --tertiary: #6B7280;
  --border: rgba(209, 217, 230, .6);
  --accent: #4F46E5;
  --accent-rgb: 79 70 229;
  --accent-2: #7C5CF0;
  --accent-soft: rgba(79, 70, 229, .12);
  --accent-text: #4338CA;
  --success: #22C55E;
  --success-text: #15803D;
  --danger-text: #B91C1C;
  --danger-soft: rgba(239, 68, 68, .10);
  --warning-text: #C2410C;
  --raised: -6px -6px 15px var(--shadow-light), 6px 6px 15px var(--shadow-dark);
  --raised-sm: -3px -3px 8px var(--shadow-light), 3px 3px 8px var(--shadow-dark);
  --inset: inset -4px -4px 10px var(--shadow-light), inset 4px 4px 10px var(--shadow-dark);
  --wall: radial-gradient(1200px 700px at 15% 10%, #DCE3F6 0%, transparent 60%), radial-gradient(900px 700px at 90% 90%, #E7DDF7 0%, transparent 60%), #E4E9F2;
  --scrim: rgba(240, 244, 248, .55);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --ease-soft: cubic-bezier(.4, 0, .2, 1);
  --spring: cubic-bezier(.34, 1.4, .64, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #14161C; --sidebar: #181B22; --surface: #1E222A; --well: #171A20;
    --shadow-light: rgba(255,255,255,.04); --shadow-dark: rgba(0,0,0,.45);
    --fg: #F3F4F6; --muted: #A1A8B5; --tertiary: #8A92A0; --border: rgba(255,255,255,.08);
    --accent: #6366F1; --accent-rgb: 99 102 241; --accent-2: #8B6CF6;
    --accent-soft: rgba(99, 102, 241, .20); --accent-text: #A5B4FC;
    --success-text: #4ADE80; --danger-text: #F87171; --danger-soft: rgba(248,113,113,.14); --warning-text: #FB923C;
    --raised: 0 1px 0 rgba(255,255,255,.05) inset, 0 6px 18px rgba(0,0,0,.35);
    --raised-sm: 0 1px 0 rgba(255,255,255,.04) inset, 0 3px 10px rgba(0,0,0,.3);
    --inset: inset 2px 2px 6px rgba(0,0,0,.45), inset -1px -1px 2px rgba(255,255,255,.04);
    --wall: radial-gradient(1200px 700px at 15% 10%, #1D2240 0%, transparent 60%), radial-gradient(900px 700px at 90% 90%, #2A1D3F 0%, transparent 60%), #0D0F14;
    --scrim: rgba(20, 22, 28, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14161C; --sidebar: #181B22; --surface: #1E222A; --well: #171A20;
  --shadow-light: rgba(255,255,255,.04); --shadow-dark: rgba(0,0,0,.45);
  --fg: #F3F4F6; --muted: #A1A8B5; --tertiary: #8A92A0; --border: rgba(255,255,255,.08);
  --accent: #6366F1; --accent-rgb: 99 102 241; --accent-2: #8B6CF6;
  --accent-soft: rgba(99, 102, 241, .20); --accent-text: #A5B4FC;
  --success-text: #4ADE80; --danger-text: #F87171; --danger-soft: rgba(248,113,113,.14); --warning-text: #FB923C;
  --raised: 0 1px 0 rgba(255,255,255,.05) inset, 0 6px 18px rgba(0,0,0,.35);
  --raised-sm: 0 1px 0 rgba(255,255,255,.04) inset, 0 3px 10px rgba(0,0,0,.3);
  --inset: inset 2px 2px 6px rgba(0,0,0,.45), inset -1px -1px 2px rgba(255,255,255,.04);
  --wall: radial-gradient(1200px 700px at 15% 10%, #1D2240 0%, transparent 60%), radial-gradient(900px 700px at 90% 90%, #2A1D3F 0%, transparent 60%), #0D0F14;
  --scrim: rgba(20, 22, 28, .5);
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.3 var(--font); color: var(--fg); background: var(--wall); background-attachment: fixed; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.ic { width: 16px; height: 16px; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.tnum { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.btn-gradient { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 16px; border-radius: 10px; color: #fff; font-weight: 600; font-size: 13px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 4px 14px rgb(var(--accent-rgb) / .35); transition: transform .2s var(--ease), filter .2s, box-shadow .2s; }
.btn-gradient:hover { transform: translateY(-1px); filter: brightness(1.04); }
.btn-gradient:active { transform: none; box-shadow: 0 2px 6px rgb(var(--accent-rgb) / .3); }
.btn-soft { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 10px; font-weight: 500; font-size: 13px; color: var(--muted);
  background: var(--surface); box-shadow: var(--raised-sm); border: 1px solid var(--border); transition: color .2s, transform .2s var(--ease); }
.btn-soft:hover { color: var(--fg); transform: translateY(-1px); }
.btn-text { height: 32px; padding: 0 10px; border-radius: 8px; font-size: 13px; color: var(--tertiary); transition: color .2s, background .2s; }
.btn-text:hover { color: var(--fg); background: var(--well); }
.icon-btn { width: 40px; height: 40px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); transition: color .2s, background .2s, transform .2s var(--ease); }
.icon-btn:hover { color: var(--fg); background: rgb(127 127 127 / .12); }
.icon-btn:active { transform: scale(.94); }

/* ---------- desk + window ---------- */
.desk { position: fixed; inset: 0; padding: 22px; display: flex; }
.window { position: relative; flex: 1; border-radius: 14px; overflow: hidden; background: var(--bg); box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 24px 70px rgba(15, 20, 40, .28); isolation: isolate; }
.lights { position: absolute; left: 18px; top: 18px; display: flex; gap: 8px; z-index: 30; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15); }
.lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
.app { position: absolute; inset: 0; display: flex; transform-origin: 50% 40%;
  transition: filter 1s var(--ease), opacity 1s var(--ease), transform 1.1s var(--ease); }
.window.is-focusing .app { filter: blur(16px) saturate(.15); opacity: .38; transform: scale(.975); pointer-events: none; }
.window.is-focusing .lights { opacity: .5; transition: opacity 1s; }

.sidebar { width: 248px; flex: none; padding: 54px 14px 16px; background: var(--sidebar); position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
.sidebar::after { content: ""; position: absolute; left: -80px; bottom: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgb(var(--accent-rgb) / .16), transparent 70%); pointer-events: none; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; letter-spacing: -.01em; padding: 0 6px 14px; }
.mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; color: #fff; box-shadow: 0 4px 12px rgb(var(--accent-rgb) / .35); }
.mark .ic { width: 17px; height: 17px; stroke-width: 2.6; }
.capture { display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--surface); box-shadow: var(--raised-sm); margin-bottom: 14px; font-weight: 500; }
.capture kbd, .search kbd { margin-left: auto; font: 12px var(--font); color: var(--tertiary); }
.navgroup { font-size: 12px; font-weight: 600; color: var(--tertiary); padding: 12px 10px 6px; }
.navitem { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 10px; color: var(--fg); }
.navitem .ic { color: var(--muted); width: 17px; height: 17px; }
.navitem .n { margin-left: auto; color: var(--tertiary); font-size: 13px; font-variant-numeric: tabular-nums; }
.navitem.sel { background: var(--accent-soft); font-weight: 600; }
.navitem.sel .ic { color: var(--accent-text); }

.content { flex: 1; min-width: 0; padding: 14px 30px 30px; overflow: hidden; display: flex; flex-direction: column; }
.toolbar { display: flex; align-items: center; gap: 10px; height: 40px; margin-bottom: 26px; }
.search { display: flex; align-items: center; gap: 9px; width: 420px; height: 36px; padding: 0 12px; border-radius: 10px; background: var(--well); box-shadow: var(--inset); color: var(--tertiary); font-size: 13.5px; }
.grow { flex: 1; }
.vh { display: flex; align-items: baseline; gap: 12px; }
.vh h1 { margin: 0; font-size: 30px; line-height: 36px; letter-spacing: -.02em; }
.vh .count { color: var(--muted); font-size: 15px; }
.vh-sub { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin: 12px 0 8px; }
.pbar { height: 6px; border-radius: 99px; background: var(--well); box-shadow: var(--inset); overflow: hidden; margin-bottom: 20px; }
.pbar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .8s var(--ease); }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.row { position: relative; display: flex; align-items: flex-start; gap: 14px; padding: 15px 16px; border-radius: 14px; background: var(--surface); box-shadow: var(--raised-sm); transition: background .2s, box-shadow .25s, transform .25s var(--ease), opacity .4s, max-height .5s var(--ease), padding .5s var(--ease), margin .5s var(--ease); max-height: 120px; }
.row:hover, .row.hover { box-shadow: var(--raised); }
.row.is-lifted { visibility: hidden; }
.cb { width: 22px; height: 22px; flex: none; margin-top: 1px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--tertiary); display: grid; place-items: center; color: #fff; transition: box-shadow .2s, background .3s; }
.cb .ic { width: 13px; height: 13px; stroke-width: 3; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .35s .1s var(--ease); }
.row .cb:hover { box-shadow: inset 0 0 0 1.5px var(--accent); }
.row.done .cb { background: var(--accent); box-shadow: none; animation: cbpop .45s var(--spring); }
.row.done .cb .ic { stroke-dashoffset: 0; }
.row.done .row-title { color: var(--tertiary); text-decoration: line-through; text-decoration-color: var(--tertiary); }
.row.gone { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; margin-bottom: -10px; overflow: hidden; }
@keyframes cbpop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 15px; line-height: 20px; font-weight: 600; transition: color .3s; }
.row-note { font-size: 14px; color: var(--muted); margin-top: 2px; }
.chips { display: flex; gap: 8px; margin-top: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--well); font-size: 12.5px; color: var(--muted); }
.chip i { width: 7px; height: 7px; border-radius: 50%; }
.chip.today { background: var(--accent-soft); color: var(--accent-text); }
.chip .ic { width: 13px; height: 13px; }
.row-end { position: relative; align-self: center; display: flex; align-items: center; gap: 8px; }
.prio { height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; background: var(--danger-soft); color: var(--danger-text); transition: opacity .2s; }
.prio.med { background: rgba(234, 88, 12, .1); color: var(--warning-text); }
.prio.low { background: var(--well); color: var(--tertiary); }

/* ---------- stage (option fills) ---------- */
.stage { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
.window.is-focusing .stage { pointer-events: auto; }

/* ---------- menubar view ---------- */
.mbview { position: fixed; inset: 0; display: none; align-items: flex-start; justify-content: center; padding-top: 40px; }
body.view-menubar .desk { display: none; }
body.view-menubar .mbview { display: flex; }
.mb-scene { position: relative; width: 600px; height: 380px; border-radius: 16px; overflow: hidden; background: var(--wall); box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 20px 60px rgba(15,20,40,.22); }
.mb-strip { height: 30px; display: flex; align-items: center; gap: 16px; padding: 0 14px; font-size: 13px; font-weight: 500; color: var(--fg); background: rgb(255 255 255 / .45); backdrop-filter: blur(20px); }
:root[data-theme="dark"] .mb-strip { background: rgb(20 22 28 / .55); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mb-strip { background: rgb(20 22 28 / .55); } }
.mb-strip .r { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.mb-strip .ic { width: 15px; height: 15px; }
.mb-item { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; background: rgb(127 127 127 / .2); font-variant-numeric: tabular-nums; }
.mb-panel { position: absolute; top: 38px; right: 92px; width: 380px; border-radius: 14px; overflow: hidden; background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(30px) saturate(1.4);
  box-shadow: 0 0 0 .5px rgba(0,0,0,.15), 0 18px 50px rgba(15,20,40,.28); }
.mb-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; transition: background .2s; }
.mb-row:hover { background: rgb(127 127 127 / .1); }
.mb-row .t { flex: 1; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mb-row .p { font-size: 12px; color: var(--tertiary); }

/* ---------- prototype controls ---------- */
.proto { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 12px; font-size: 12px;
  background: rgb(20 22 30 / .78); color: #E5E7EB; backdrop-filter: blur(16px); box-shadow: 0 6px 24px rgba(0,0,0,.25); opacity: .35; transition: opacity .25s; }
.proto:hover, .proto:focus-within { opacity: 1; }
.proto .lbl { padding: 0 6px 0 8px; color: #9CA3AF; }
.proto button { height: 26px; padding: 0 9px; border-radius: 8px; color: #D1D5DB; }
.proto button:hover { background: rgba(255,255,255,.08); }
.proto button.on { background: rgba(255,255,255,.16); color: #fff; }
.proto .sep { width: 1px; height: 16px; background: rgba(255,255,255,.15); margin: 0 4px; }
body.shot .proto { display: none; }
body.instant *, body.instant *::before, body.instant *::after { transition: none !important; animation-delay: -10s !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  .window.is-focusing .app { transform: none; }
}


/* ================= Option C: Stage (the task card is the progress) ================= */
.row { cursor: default; }
.row.sel { background: color-mix(in srgb, var(--surface) 92%, var(--accent)); box-shadow: var(--raised-sm), 0 0 0 1px rgb(var(--accent-rgb) / .35); }
.start-btn { position: absolute; right: 0; top: 50%; transform: translateY(-50%) scale(.96); opacity: 0; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 10px; border-radius: 999px;
  font-size: 13px; font-weight: 600; color: var(--accent-text); background: var(--accent-soft); transition: opacity .2s, transform .25s var(--ease); white-space: nowrap; }
.start-btn .ic { width: 12px; height: 12px; }
.row:hover .start-btn, .row.hover .start-btn, .start-btn:focus-visible { opacity: 1; transform: translateY(-50%); }
.row:hover .prio, .row.hover .prio { opacity: 0; }
.row.lift { transform: translateY(-3px) scale(1.012); box-shadow: 0 18px 40px rgba(15, 20, 40, .16); }

.c-veil { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 1.1s; }
.c-halo { position: absolute; left: 50%; top: 50%; width: 900px; height: 700px; margin: -350px 0 0 -450px; border-radius: 50%; opacity: 0; transition: opacity 1.4s, transform 1.4s var(--ease);
  background: radial-gradient(closest-side, rgb(var(--accent-rgb) / calc(.10 + var(--fill, 0) * .22)), transparent); }
.stage.lit .c-veil, .stage.lit .c-halo { opacity: 1; }

.c-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-bottom: 20px; perspective: 1600px; opacity: 0; visibility: hidden; transition: opacity .4s, visibility 0s .4s; }
.stage.on .c-center { opacity: 1; visibility: visible; transition: opacity .3s; }
.c-flip { position: relative; display: grid; width: 640px; transform-style: preserve-3d; transition: transform 1s var(--ease); }
.stage[data-phase="break"] .c-flip { transform: rotateY(180deg); }
.c-face { grid-area: 1 / 1; border-radius: 26px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.c-card { position: relative; overflow: hidden; padding: 26px 32px 30px; --fa: .17; --fb: .07; background: color-mix(in srgb, var(--surface) 94%, transparent);
  box-shadow: 0 1px 0 rgb(255 255 255 / .4) inset, 0 30px 80px rgba(15, 20, 40, .16), 0 0 0 .5px var(--border), 0 0 calc(var(--fill, 0) * 60px) rgb(var(--accent-rgb) / calc(var(--fill, 0) * .35));
  transition: box-shadow 1s var(--ease), background .6s; }
.c-back { position: relative; transform: rotateY(180deg); background: color-mix(in srgb, var(--surface) 94%, transparent); box-shadow: 0 30px 80px rgba(15, 20, 40, .16), 0 0 0 .5px var(--border);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px; }
.c-ghost { position: absolute; display: none; border-radius: 26px; background: var(--surface); box-shadow: 0 30px 80px rgba(15, 20, 40, .18); }
.stage .c-card.flying { background: transparent !important; box-shadow: none !important; }
.c-card.flying, .c-card.flying > * { transition: none !important; }
.c-card.flying > *:not(.c-title) { opacity: 0; }
.c-card > * { position: relative; transition: opacity .45s var(--ease); }

/* the fill: the card itself is the progress */
.c-fill { position: absolute !important; left: 0; right: 0; bottom: 0; height: calc(var(--fill, 0) * 100% + 10px); transition: height 1.2s var(--spring);
  background: linear-gradient(to top, rgb(var(--accent-rgb) / var(--fa, .17)), rgb(var(--accent-rgb) / var(--fb, .07))); pointer-events: none; }
:root[data-theme="dark"] .c-card, :root[data-theme="dark"] .pc { --fa: .16; --fb: .05; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .c-card, :root:not([data-theme="light"]) .pc { --fa: .16; --fb: .05; } }
.c-wave .edge { fill: none; stroke: rgb(var(--accent-rgb) / .45); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
.c-wave { position: absolute; left: 0; top: -14px; width: 200%; height: 16px; animation: wave 7s linear infinite; }
.c-wave.w2 { animation-duration: 11s; opacity: .55; top: -11px; }
.c-wave path { fill: rgb(var(--accent-rgb) / var(--fb, .07)); }
@keyframes wave { to { transform: translateX(-50%); } }
.stage.paused .c-wave { animation-play-state: paused; }
.c-sweep { position: absolute !important; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgb(255 255 255 / .55) 50%, transparent 65%); background-size: 250% 100%; background-position: 130% 0; opacity: 0; }
:root[data-theme="dark"] .c-sweep { background-image: linear-gradient(105deg, transparent 35%, rgb(255 255 255 / .12) 50%, transparent 65%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .c-sweep { background-image: linear-gradient(105deg, transparent 35%, rgb(255 255 255 / .12) 50%, transparent 65%); } }
.c-sweep.go { animation: sweep 1.1s var(--ease-soft); }
@keyframes sweep { 0% { opacity: 1; background-position: 130% 0; } 100% { opacity: 1; background-position: -30% 0; } }
.c-timebar { position: absolute !important; left: 0; top: 0; height: 2px; width: 0; background: linear-gradient(90deg, rgb(var(--accent-rgb) / .2), var(--accent)); }

.c-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.c-head .dot { width: 7px; height: 7px; border-radius: 50%; }
.c-pill { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px 0 9px; border-radius: 999px; background: var(--well); color: var(--muted); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; transition: color .2s, background .2s; }
.c-pill:hover { color: var(--fg); }
.c-pill svg { width: 14px; height: 14px; } .c-pill svg.ring { transform: rotate(-90deg); }
.c-pill .trk { fill: none; stroke: currentColor; stroke-opacity: .2; stroke-width: 3; }
.c-pill .arc { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
.stage.paused .c-pill { color: var(--accent-text); background: var(--accent-soft); }
.c-x { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--tertiary); }
.c-x:hover { background: var(--well); color: var(--fg); }
.c-x .ic { width: 14px; height: 14px; }

<template id="stageTpl">

<script>
/* Shared prototype core: app shell, focus state machine, timer, chime, helpers. */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const ICONS = {

  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  sparkle: '<path d="M12 3.5l1.7 5.2 5.3 1.8-5.3 1.8L12 17.5l-1.7-5.2L5 10.5l5.3-1.8z"/><path d="M19 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>',
  calendar: '<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/>',
  next: '<circle cx="12" cy="12" r="9.5"/><path d="M10.2 8.5l5 3.5-5 3.5z"/>',

  sprout: '<path d="M12 21v-8"/><path d="M12 13c0-4 2.5-6.5 7-6.5 0 4.5-2.8 6.5-7 6.5z"/><path d="M12 15.5c0-3-2-5-5.5-5 0 3.4 2.2 5 5.5 5z"/>',
  arrowRight: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  wifi: '<path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.2" r=".9" fill="currentColor"/>',
  battery: '<rect x="2.5" y="7" width="17" height="10" rx="2.5"/><rect x="4.5" y="9" width="11" height="6" rx="1" fill="currentColor" stroke="none"/><path d="M21.5 10.5v3"/>',
  apple: '<path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2-1.1 2.8-2.3.9-1.3 1.2-2.5 1.3-2.6-.1 0-2.5-.9-2.5-3.8zM14.1 5.8c.6-.8 1.1-1.8 1-2.8-.9 0-2 .6-2.7 1.4-.6.7-1.1 1.7-1 2.7 1 .1 2-.5 2.7-1.3z" fill="currentColor" stroke="none"/>',
};
const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

const TASKS = [
  { id: 't1', title: 'Write the quarterly report', project: 'Work', color: '#3B82F6', due: 'Today', prio: 'High',
    steps: ['Pull the Q3 numbers from the dashboard', 'Draft the revenue summary', 'Add the two key charts', 'Write the outlook paragraph', 'Read it once, then send to Priya'],
    tips: ['Just copy them in. Tidy later.', 'Three plain sentences is a fine first pass.', 'Revenue by month, then pipeline. That is enough.', 'What changes next quarter, in one paragraph.', 'One read-through, then let it go.'] },
  { id: 't2', title: 'Reply to Sam about the offsite', project: 'Team', color: '#A855F7', due: 'Today', prio: 'Med',
    steps: ['Check the two date options', 'Confirm the venue budget', 'Write the reply'],
    tips: ['Look at the shared calendar.', 'The number is in the planning doc.', 'Short and clear is kind.'] },
  { id: 't3', title: 'Plan the November content calendar', project: 'Marketing', color: '#F59E0B', due: 'Sat, 8 Nov', prio: null,
    steps: ['List the four launch dates', 'Draft one post idea per week', 'Assign owners', 'Share with Nijrika'],
    tips: ['Start from the product roadmap.', 'Rough is fine.', 'One name per post.', 'Drop it in the team channel.'] },
  { id: 't4', title: 'Book dentist appointment', project: 'Personal', color: '#22C55E', due: null, prio: 'Low',
    steps: ['Find the clinic number', 'Pick two free mornings', 'Call and book'],
    tips: ['It is in your contacts.', 'Tuesday or Thursday works.', 'Two minutes, tops.'] },
];
const taskById = (id) => TASKS.find((t) => t.id === id);

/* ---------- state ---------- */
const S = {
  view: 'window', phase: 'idle', taskId: null, steps: [], stepsLoading: false,
  focusSec: 25 * 60, breakSec: 5 * 60, elapsed: 0, running: false, speed: 1, sound: false,
  sessionsToday: 2, finishKind: null, completed: new Set(),
};
const listeners = {};
const on = (e, f) => (listeners[e] ||= []).push(f);
const emit = (e, ...a) => (listeners[e] || []).forEach((f) => f(...a));

const total = () => (S.phase === 'break' ? S.breakSec : S.focusSec);
const progress = () => Math.min(1, S.elapsed / total());
const remaining = () => Math.max(0, Math.ceil(total() - S.elapsed));
const fmt = (sec) => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
const fmt2 = (sec) => `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
const doneCount = () => S.steps.filter((s) => s.done).length;
const currentStep = () => S.steps.findIndex((s) => !s.done);
const task = () => taskById(S.taskId);

function encourage() {
  const d = doneCount(), n = S.steps.length;
  if (!n) return '';
  if (d === n) return 'Every step done.';
  if (n - d === 1) return 'Last one. Finish it off.';
  if (d / n >= .5) return 'Past halfway. Keep the pace.';
  if (d === 1) return 'Nice. One down.';
  return 'Good. On to the next.';
}
function finishLine() {
  if (S.finishKind === 'task') return 'Every step done. You finished the whole thing.';
  return `${Math.round(S.focusSec / 60)} minutes on one thing. That counts.`;
}

const Focus = {
  start(id) {
    if (S.phase !== 'idle') return;
    S.taskId = id; S.steps = []; S.stepsLoading = true; S.elapsed = 0; S.running = true; S.finishKind = null;
    S.phase = 'focus';
    emit('phase', 'idle', 'focus', {});
    chime('start');
    setTimeout(() => {
      if (S.taskId !== id || !S.stepsLoading) return;
      S.steps = task().steps.map((title) => ({ title, done: false }));
      S.stepsLoading = false;
      emit('steps');
    }, RM ? 200 : 1300);
  },
  toggleRun() { if (S.phase === 'focus' || S.phase === 'break') { S.running = !S.running; emit('run'); } },
  toggleStep(i) {
    const s = S.steps[i]; if (!s || S.phase !== 'focus') return;
    s.done = !s.done; emit('step', i, s.done);
    if (s.done) chime('tick');
    if (S.steps.every((x) => x.done)) setTimeout(() => { if (S.phase === 'focus' && S.steps.every((x) => x.done)) Focus.finish('task'); }, RM ? 300 : 1000);
  },
  finish(kind) {
    const from = S.phase; S.running = false; S.finishKind = kind; S.sessionsToday += 1; S.phase = 'finish';
    emit('phase', from, 'finish', {}); chime('finish');
  },
  takeBreak() { const from = S.phase; S.phase = 'break'; S.elapsed = 0; S.running = true; emit('phase', from, 'break', {}); },
  keepGoing() { const from = S.phase; S.phase = 'focus'; S.elapsed = 0; S.running = true; S.finishKind = null; emit('phase', from, 'focus', { again: true }); },
  markDone() { const from = S.phase; const id = S.taskId; S.phase = 'idle'; S.running = false; S.completed.add(id); emit('phase', from, 'idle', { completed: id }); },
  stop() { if (S.phase === 'idle') return; const from = S.phase; S.phase = 'idle'; S.running = false; emit('phase', from, 'idle', {}); },
};

/* ---------- timer loop ---------- */
let last = performance.now();
function loop(t) {
  const dt = Math.min(.25, (t - last) / 1000); last = t;
  if (S.running && (S.phase === 'focus' || S.phase === 'break')) {
    S.elapsed += dt * S.speed;
    if (S.elapsed >= total()) {
      S.elapsed = total();
      if (S.phase === 'focus') Focus.finish('time');
      else { S.phase = 'focus'; S.elapsed = 0; S.running = false; emit('phase', 'break', 'focus', { ready: true }); chime('soft'); }
    }
  }
  emit('tick', t);
  requestAnimationFrame(loop);
}

/* ---------- chime (WebAudio, off by default) ---------- */
let ac;
function chime(kind) {
  if (!S.sound) return;

  if (S.phase === 'break') body = `<div class="pc-h">${icon('coffee')}Break</div><div class="pc-title" style="font-family:var(--display);font-weight:200;font-size:44px;letter-spacing:-.04em" id="pcTime">${fmt(remaining())}</div><div class="pc-now"><div><div class="s">Back to</div><div class="t">${c >= 0 ? S.steps[c].title : t.title}</div></div></div>`;
  else if (S.phase === 'finish') body = `<div class="pc-h" style="${lit ? 'color:rgb(255 255 255 / .85)' : ''}">${t.project}</div><div class="pc-title" style="${lit ? 'color:#fff' : ''}">${t.title}</div><div style="margin-top:8px;font-size:14px;${lit ? 'color:#fff' : ''}">${finishLine()}</div>
    <div style="display:flex;gap:8px;margin-top:14px">${S.finishKind === 'task' ? `<button class="btn-light" style="height:32px;background:#fff;color:#3730A3" data-pact="done">${icon('check')}Mark as done</button><button class="btn-ghost" style="height:32px;color:#fff;background:rgb(255 255 255 / .16)" data-pact="break">Break</button>` : `<button class="btn-gradient" style="height:32px" data-pact="break">Take a break</button><button class="btn-soft" style="height:32px" data-pact="again">Keep going</button>`}</div>`;
  else body = `<div class="pc-h"><span class="dot" style="width:7px;height:7px;border-radius:50%;background:${t.color}"></span>${t.project}<button class="c-pill" data-pact="run" aria-label="${S.running ? 'Pause' : 'Resume'}">${icon(S.running ? 'pause' : 'play')}<span id="pcTime">${fmt(remaining())}</span></button></div>
    <div class="pc-title">${t.title}</div>
    ${S.stepsLoading ? `<div class="pc-now"><div class="s">${icon('sparkle')} Breaking it into steps</div></div>` : c >= 0 ? `<div class="pc-now"><button class="c-check" data-pstep="${c}" aria-label="Complete: ${S.steps[c].title}">${icon('check')}</button><div><div class="t">${S.steps[c].title}</div><div class="s">Step ${doneCount() + 1} of ${S.steps.length}</div></div></div>` : ''}`;
  P.innerHTML = `<div class="pc">${fill}${body}</div>`;
  const f = lit ? 1 : fillVal(); P.querySelector('.pc').style.setProperty('--fill', f);
}
document.addEventListener('click', async (e) => {
  if (!e.target.closest('#mbPanel')) return;
  const st = e.target.closest('[data-pstart]'); if (st) Focus.start(st.dataset.pstart);
  const sp = e.target.closest('[data-pstep]'); if (sp) { sp.classList.add('on'); await wait(RM ? 0 : 400); Focus.toggleStep(+sp.dataset.pstep); }
  const a = e.target.closest('[data-pact]')?.dataset.pact;
  if (a === 'run') Focus.toggleRun(); if (a === 'stop') Focus.stop(); if (a === 'done') Focus.markDone(); if (a === 'break') Focus.takeBreak(); if (a === 'again') Focus.keepGoing();
});

boot(initC);
</script>
</body>
</html>
