<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stride Focus: B, Grow</title>
<style>
/* ---------- Stride Soft UI tokens ---------- */
:root {
  color-scheme: light;
  --bg: #F0F4F8;
  --sidebar: #EAEEF5;
  --surface: #FFFFFF;
  --well: #E9EEF4;
  --shadow-light: #FFFFFF;
  --shadow-dark: #D1D9E6;
  --fg: #1F2937;
  --muted: #4B5563;
  --tertiary: #6B7280;
  --border: rgba(209, 217, 230, .6);
  --accent: #4F46E5;
  --accent-rgb: 79 70 229;
  --accent-2: #7C5CF0;
  --accent-soft: rgba(79, 70, 229, .12);
  --accent-text: #4338CA;
  --success: #22C55E;
  --success-text: #15803D;
  --danger-text: #B91C1C;
  --danger-soft: rgba(239, 68, 68, .10);
  --warning-text: #C2410C;
  --raised: -6px -6px 15px var(--shadow-light), 6px 6px 15px var(--shadow-dark);
  --raised-sm: -3px -3px 8px var(--shadow-light), 3px 3px 8px var(--shadow-dark);
  --inset: inset -4px -4px 10px var(--shadow-light), inset 4px 4px 10px var(--shadow-dark);
  --wall: radial-gradient(1200px 700px at 15% 10%, #DCE3F6 0%, transparent 60%), radial-gradient(900px 700px at 90% 90%, #E7DDF7 0%, transparent 60%), #E4E9F2;
  --scrim: rgba(240, 244, 248, .55);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --ease-soft: cubic-bezier(.4, 0, .2, 1);
  --spring: cubic-bezier(.34, 1.4, .64, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #14161C; --sidebar: #181B22; --surface: #1E222A; --well: #171A20;
    --shadow-light: rgba(255,255,255,.04); --shadow-dark: rgba(0,0,0,.45);
    --fg: #F3F4F6; --muted: #A1A8B5; --tertiary: #8A92A0; --border: rgba(255,255,255,.08);
    --accent: #6366F1; --accent-rgb: 99 102 241; --accent-2: #8B6CF6;
    --accent-soft: rgba(99, 102, 241, .20); --accent-text: #A5B4FC;
    --success-text: #4ADE80; --danger-text: #F87171; --danger-soft: rgba(248,113,113,.14); --warning-text: #FB923C;
    --raised: 0 1px 0 rgba(255,255,255,.05) inset, 0 6px 18px rgba(0,0,0,.35);
    --raised-sm: 0 1px 0 rgba(255,255,255,.04) inset, 0 3px 10px rgba(0,0,0,.3);
    --inset: inset 2px 2px 6px rgba(0,0,0,.45), inset -1px -1px 2px rgba(255,255,255,.04);
    --wall: radial-gradient(1200px 700px at 15% 10%, #1D2240 0%, transparent 60%), radial-gradient(900px 700px at 90% 90%, #2A1D3F 0%, transparent 60%), #0D0F14;
    --scrim: rgba(20, 22, 28, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14161C; --sidebar: #181B22; --surface: #1E222A; --well: #171A20;
  --shadow-light: rgba(255,255,255,.04); --shadow-dark: rgba(0,0,0,.45);
  --fg: #F3F4F6; --muted: #A1A8B5; --tertiary: #8A92A0; --border: rgba(255,255,255,.08);
  --accent: #6366F1; --accent-rgb: 99 102 241; --accent-2: #8B6CF6;
  --accent-soft: rgba(99, 102, 241, .20); --accent-text: #A5B4FC;
  --success-text: #4ADE80; --danger-text: #F87171; --danger-soft: rgba(248,113,113,.14); --warning-text: #FB923C;
  --raised: 0 1px 0 rgba(255,255,255,.05) inset, 0 6px 18px rgba(0,0,0,.35);
  --raised-sm: 0 1px 0 rgba(255,255,255,.04) inset, 0 3px 10px rgba(0,0,0,.3);
  --inset: inset 2px 2px 6px rgba(0,0,0,.45), inset -1px -1px 2px rgba(255,255,255,.04);
  --wall: radial-gradient(1200px 700px at 15% 10%, #1D2240 0%, transparent 60%), radial-gradient(900px 700px at 90% 90%, #2A1D3F 0%, transparent 60%), #0D0F14;
  --scrim: rgba(20, 22, 28, .5);
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.3 var(--font); color: var(--fg); background: var(--wall); background-attachment: fixed; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.ic { width: 16px; height: 16px; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.tnum { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.btn-gradient { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 16px; border-radius: 10px; color: #fff; font-weight: 600; font-size: 13px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 4px 14px rgb(var(--accent-rgb) / .35); transition: transform .2s var(--ease), filter .2s, box-shadow .2s; }
.btn-gradient:hover { transform: translateY(-1px); filter: brightness(1.04); }
.btn-gradient:active { transform: none; box-shadow: 0 2px 6px rgb(var(--accent-rgb) / .3); }
.btn-soft { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 10px; font-weight: 500; font-size: 13px; color: var(--muted);
  background: var(--surface); box-shadow: var(--raised-sm); border: 1px solid var(--border); transition: color .2s, transform .2s var(--ease); }
.btn-soft:hover { color: var(--fg); transform: translateY(-1px); }
.btn-text { height: 32px; padding: 0 10px; border-radius: 8px; font-size: 13px; color: var(--tertiary); transition: color .2s, background .2s; }
.btn-text:hover { color: var(--fg); background: var(--well); }
.icon-btn { width: 40px; height: 40px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); transition: color .2s, background .2s, transform .2s var(--ease); }
.icon-btn:hover { color: var(--fg); background: rgb(127 127 127 / .12); }
.icon-btn:active { transform: scale(.94); }

/* ---------- desk + window ---------- */
.desk { position: fixed; inset: 0; padding: 22px; display: flex; }
.window { position: relative; flex: 1; border-radius: 14px; overflow: hidden; background: var(--bg); box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 24px 70px rgba(15, 20, 40, .28); isolation: isolate; }
.lights { position: absolute; left: 18px; top: 18px; display: flex; gap: 8px; z-index: 30; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15); }
.lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
.app { position: absolute; inset: 0; display: flex; transform-origin: 50% 40%;
  transition: filter 1s var(--ease), opacity 1s var(--ease), transform 1.1s var(--ease); }
.window.is-focusing .app { filter: blur(16px) saturate(.15); opacity: .38; transform: scale(.975); pointer-events: none; }
.window.is-focusing .lights { opacity: .5; transition: opacity 1s; }

.sidebar { width: 248px; flex: none; padding: 54px 14px 16px; background: var(--sidebar); position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
.sidebar::after { content: ""; position: absolute; left: -80px; bottom: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgb(var(--accent-rgb) / .16), transparent 70%); pointer-events: none; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; letter-spacing: -.01em; padding: 0 6px 14px; }
.mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; color: #fff; box-shadow: 0 4px 12px rgb(var(--accent-rgb) / .35); }
.mark .ic { width: 17px; height: 17px; stroke-width: 2.6; }
.capture { display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--surface); box-shadow: var(--raised-sm); margin-bottom: 14px; font-weight: 500; }
.capture kbd, .search kbd { margin-left: auto; font: 12px var(--font); color: var(--tertiary); }
.navgroup { font-size: 12px; font-weight: 600; color: var(--tertiary); padding: 12px 10px 6px; }
.navitem { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 10px; color: var(--fg); }
.navitem .ic { color: var(--muted); width: 17px; height: 17px; }
.navitem .n { margin-left: auto; color: var(--tertiary); font-size: 13px; font-variant-numeric: tabular-nums; }
.navitem.sel { background: var(--accent-soft); font-weight: 600; }
.navitem.sel .ic { color: var(--accent-text); }

.content { flex: 1; min-width: 0; padding: 14px 30px 30px; overflow: hidden; display: flex; flex-direction: column; }
.toolbar { display: flex; align-items: center; gap: 10px; height: 40px; margin-bottom: 26px; }
.search { display: flex; align-items: center; gap: 9px; width: 420px; height: 36px; padding: 0 12px; border-radius: 10px; background: var(--well); box-shadow: var(--inset); color: var(--tertiary); font-size: 13.5px; }
.grow { flex: 1; }
.vh { display: flex; align-items: baseline; gap: 12px; }
.vh h1 { margin: 0; font-size: 30px; line-height: 36px; letter-spacing: -.02em; }
.vh .count { color: var(--muted); font-size: 15px; }
.vh-sub { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin: 12px 0 8px; }
.pbar { height: 6px; border-radius: 99px; background: var(--well); box-shadow: var(--inset); overflow: hidden; margin-bottom: 20px; }
.pbar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .8s var(--ease); }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.row { position: relative; display: flex; align-items: flex-start; gap: 14px; padding: 15px 16px; border-radius: 14px; background: var(--surface); box-shadow: var(--raised-sm); transition: background .2s, box-shadow .25s, transform .25s var(--ease), opacity .4s, max-height .5s var(--ease), padding .5s var(--ease), margin .5s var(--ease); max-height: 120px; }
.row:hover, .row.hover { box-shadow: var(--raised); }
.row.is-lifted { visibility: hidden; }
.cb { width: 22px; height: 22px; flex: none; margin-top: 1px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--tertiary); display: grid; place-items: center; color: #fff; transition: box-shadow .2s, background .3s; }
.cb .ic { width: 13px; height: 13px; stroke-width: 3; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .35s .1s var(--ease); }
.row .cb:hover { box-shadow: inset 0 0 0 1.5px var(--accent); }
.row.done .cb { background: var(--accent); box-shadow: none; animation: cbpop .45s var(--spring); }
.row.done .cb .ic { stroke-dashoffset: 0; }
.row.done .row-title { color: var(--tertiary); text-decoration: line-through; text-decoration-color: var(--tertiary); }
.row.gone { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; margin-bottom: -10px; overflow: hidden; }
@keyframes cbpop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 15px; line-height: 20px; font-weight: 600; transition: color .3s; }
.row-note { font-size: 14px; color: var(--muted); margin-top: 2px; }
.chips { display: flex; gap: 8px; margin-top: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--well); font-size: 12.5px; color: var(--muted); }
.chip i { width: 7px; height: 7px; border-radius: 50%; }
.chip.today { background: var(--accent-soft); color: var(--accent-text); }
.chip .ic { width: 13px; height: 13px; }
.row-end { position: relative; align-self: center; display: flex; align-items: center; gap: 8px; }
.prio { height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; background: var(--danger-soft); color: var(--danger-text); transition: opacity .2s; }
.prio.med { background: rgba(234, 88, 12, .1); color: var(--warning-text); }
.prio.low { background: var(--well); color: var(--tertiary); }

/* ---------- stage (option fills) ---------- */
.stage { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
.window.is-focusing .stage { pointer-events: auto; }

/* ---------- menubar view ---------- */
.mbview { position: fixed; inset: 0; display: none; align-items: flex-start; justify-content: center; padding-top: 40px; }
body.view-menubar .desk { display: none; }
body.view-menubar .mbview { display: flex; }
.mb-scene { position: relative; width: 600px; height: 380px; border-radius: 16px; overflow: hidden; background: var(--wall); box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 20px 60px rgba(15,20,40,.22); }
.mb-strip { height: 30px; display: flex; align-items: center; gap: 16px; padding: 0 14px; font-size: 13px; font-weight: 500; color: var(--fg); background: rgb(255 255 255 / .45); backdrop-filter: blur(20px); }
:root[data-theme="dark"] .mb-strip { background: rgb(20 22 28 / .55); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mb-strip { background: rgb(20 22 28 / .55); } }
.mb-strip .r { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.mb-strip .ic { width: 15px; height: 15px; }
.mb-item { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; background: rgb(127 127 127 / .2); font-variant-numeric: tabular-nums; }
.mb-panel { position: absolute; top: 38px; right: 92px; width: 380px; border-radius: 14px; overflow: hidden; background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(30px) saturate(1.4);
  box-shadow: 0 0 0 .5px rgba(0,0,0,.15), 0 18px 50px rgba(15,20,40,.28); }
.mb-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; transition: background .2s; }
.mb-row:hover { background: rgb(127 127 127 / .1); }
.mb-row .t { flex: 1; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mb-row .p { font-size: 12px; color: var(--tertiary); }

/* ---------- prototype controls ---------- */
.proto { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 12px; font-size: 12px;
  background: rgb(20 22 30 / .78); color: #E5E7EB; backdrop-filter: blur(16px); box-shadow: 0 6px 24px rgba(0,0,0,.25); opacity: .35; transition: opacity .25s; }
.proto:hover, .proto:focus-within { opacity: 1; }
.proto .lbl { padding: 0 6px 0 8px; color: #9CA3AF; }
.proto button { height: 26px; padding: 0 9px; border-radius: 8px; color: #D1D5DB; }
.proto button:hover { background: rgba(255,255,255,.08); }
.proto button.on { background: rgba(255,255,255,.16); color: #fff; }
.proto .sep { width: 1px; height: 16px; background: rgba(255,255,255,.15); margin: 0 4px; }
body.shot .proto { display: none; }
body.instant *, body.instant *::before, body.instant *::after { transition: none !important; animation-delay: -10s !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  .window.is-focusing .app { transform: none; }
}


/* ================= Option B: Grow (a living plant) ================= */
:root { --leaf-a: #2F9E62; --leaf-b: #86D9A8; --stem: #3C9A66; --petal-a: var(--accent); --petal-b: #E879F9; --sun: 253 224 140; --sun-a: .8; --ground: rgba(31, 41, 55, .18); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --leaf-a: #2A8F5A; --leaf-b: #6EE7A8; --stem: #4CC285; --petal-b: #F0ABFC; --sun: 251 191 36; --sun-a: .32; --ground: rgba(255,255,255,.16); } }
:root[data-theme="dark"] { --leaf-a: #2A8F5A; --leaf-b: #6EE7A8; --stem: #4CC285; --petal-b: #F0ABFC; --sun: 251 191 36; --sun-a: .32; --ground: rgba(255,255,255,.16); }

.start-btn { position: absolute; right: 0; top: 50%; transform: translateY(-50%) scale(.96); opacity: 0; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 10px; border-radius: 999px;
  font-size: 13px; font-weight: 600; color: var(--success-text); background: rgba(34, 197, 94, .12); transition: opacity .2s, transform .25s var(--ease); white-space: nowrap; }
.start-btn .ic { width: 15px; height: 15px; }
.row:hover .start-btn, .row.hover .start-btn, .start-btn:focus-visible { opacity: 1; transform: translateY(-50%); }
.row:hover .prio, .row.hover .prio { opacity: 0; }
.garden-strip { display: flex; align-items: center; gap: 14px; margin: -6px 0 18px; padding: 8px 14px; height: 52px; border-radius: 14px; background: var(--well); box-shadow: var(--inset); font-size: 13px; color: var(--muted); }
.garden-strip .minis { display: flex; align-items: flex-end; gap: 4px; height: 36px; }
.mini { width: 22px; height: 34px; overflow: visible; }
.mini .st { stroke: var(--stem); stroke-width: 1.6; fill: none; stroke-linecap: round; }
.mini .lf { fill: var(--leaf-a); }
.mini .fl { fill: url(#petalGrad); }
.mini.seed .st, .mini.seed .lf, .mini.seed .fl { display: none; }
.mini .soil { fill: var(--ground); }
.mini.pop { animation: miniPop .9s var(--spring) both; transform-origin: 50% 100%; transform-box: fill-box; }
@keyframes miniPop { from { transform: scale(0); opacity: 0; } }

.b-veil { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 1.2s; }
.b-sky { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s, background 2s; background: radial-gradient(900px 600px at 34% 110%, rgb(var(--sun) / .22), transparent 70%); }
.stage.lit .b-veil, .stage.lit .b-sky { opacity: 1; }
.stage[data-phase="break"] .b-sky { background: radial-gradient(900px 600px at 34% 110%, rgba(56, 189, 248, .14), transparent 70%), linear-gradient(rgba(30, 41, 90, .10), transparent 60%); }

.b-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 56px; padding-bottom: 40px; opacity: 0; visibility: hidden; transition: opacity .4s, visibility 0s .4s; }
.stage.on .b-center { opacity: 1; visibility: visible; transition: opacity .3s; }
.b-plantcol { display: flex; flex-direction: column; align-items: center; }
.b-plant { width: 340px; height: 440px; overflow: visible; }
.b-time { margin-top: -6px; font-family: var(--display); font-weight: 300; font-size: 44px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; transition: opacity .4s; }
.b-tlabel { margin-top: 6px; font-size: 13px; color: var(--tertiary); height: 18px; }
.stage.paused .b-time { opacity: .45; }
.stage[data-phase="finish"] .b-time, .stage[data-phase="finish"] .b-tlabel { opacity: 0; }

/* plant parts */
.p-stem { fill: none; stroke: var(--stem); stroke-width: 3.2; stroke-linecap: round; }
.p-leaf { transform: scale(0); transition: transform 1.4s var(--spring); }
.p-leaf.open { transform: scale(1); }
.p-leaf path { fill: url(#leafGrad); }
.p-leaf .rib { fill: none; stroke: rgba(255, 255, 255, .45); stroke-width: 1; }
.p-petal { transition: transform 1.1s var(--spring), opacity .6s; }
.p-petal ellipse { fill: url(#petalGrad); }
.p-petal.in ellipse { fill: url(#innerGrad); }
.p-flower { transition: transform 1.2s var(--spring); }
.p-core { fill: #FBBF24; transition: transform .8s var(--spring); }
.p-bud { fill: url(#budGrad); transition: opacity .6s; }
.p-sway { transform-origin: 170px 392px; transform-box: view-box; animation: sway 7s ease-in-out infinite alternate; }
.stage[data-phase="break"] .p-sway { animation-duration: 12s; }
.stage.paused .p-sway { animation-play-state: paused; }
@keyframes sway { from { transform: rotate(-1.3deg); } to { transform: rotate(1.3deg); } }
.p-sun { transition: fill-opacity 2s; }
.p-ground { stroke: url(#groundGrad); stroke-width: 1.2; }
.p-shadow { fill: var(--ground); opacity: .5; }
.p-star { fill: var(--fg); opacity: 0; }
.stage[data-phase="break"] .p-star { animation: twinkle 3.2s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: .55; } }
.p-glow { opacity: 0; transition: opacity 1.2s; }
.stage[data-phase="finish"][data-kind="task"] .p-glow { opacity: 1; }
.p-seed { opacity: 0; }
.pollen { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #FCD34D; box-shadow: 0 0 8px #FCD34D; pointer-events: none; animation: pollen var(--d) var(--ease-soft) forwards; }
@keyframes pollen { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1); } }
.spark { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); pointer-events: none; animation: spark .7s var(--ease) forwards; }
@keyframes spark { from { opacity: 1; transform: translate(0, 0); } to { opacity: 0; transform: translate(var(--x), var(--y)); } }

.b-col { width: 440px; }
.b-card { position: relative; padding: 22px 24px 20px; border-radius: 22px; background: color-mix(in srgb, var(--surface) 80%, transparent); backdrop-filter: blur(28px) saturate(1.3);
  box-shadow: 0 1px 0 rgb(255 255 255 / .35) inset, 0 24px 60px rgba(15, 20, 40, .14), 0 0 0 .5px var(--border); transition: background .4s, box-shadow .4s; }

.b-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.b-head .dot { width: 7px; height: 7px; border-radius: 50%; }

.b-wrap { overflow: hidden; }
.b-steps { list-style: none; margin: 12px 0 0; padding: 0; }
.b-step { display: flex; align-items: center; gap: 12px; min-height: 42px; color: var(--tertiary); font-size: 14.5px; transition: color .4s; }
.b-step.cur { color: var(--fg); }
.b-step .sc { position: relative; width: 22px; height: 22px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; display: grid; place-items: center; transition: background .35s var(--ease), box-shadow .3s, transform .2s; }
.b-step.cur .sc { box-shadow: inset 0 0 0 1.5px var(--accent); }
.b-step .sc:hover { transform: scale(1.08); } .b-step .sc:active { transform: scale(.9); }
.b-step .sc .ic { width: 13px; height: 13px; stroke-width: 3; color: #fff; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .35s .12s var(--ease); }
.b-step .lbl { position: relative; }
.b-step .lbl::after { content: ""; position: absolute; left: 0; top: 54%; height: 1px; width: 0; background: currentColor; opacity: .8; transition: width .45s .1s var(--ease); }
.b-step.done .sc { background: linear-gradient(135deg, var(--accent), var(--petal-b)); box-shadow: none; animation: cbpop .5s var(--spring); }

.b-load .ic { color: var(--accent-text); width: 15px; height: 15px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }

.b-note { height: 22px; margin-top: 16px; padding-left: 4px; font-size: 14px; color: var(--muted); opacity: 0; transform: translateY(4px); transition: opacity .5s, transform .5s var(--ease); }

<script>

  calendar: '<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/>',

const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

const TASKS = [
  { id: 't1', title: 'Write the quarterly report', project: 'Work', color: '#3B82F6', due: 'Today', prio: 'High',
    steps: ['Pull the Q3 numbers from the dashboard', 'Draft the revenue summary', 'Add the two key charts', 'Write the outlook paragraph', 'Read it once, then send to Priya'],

  { id: 't2', title: 'Reply to Sam about the offsite', project: 'Team', color: '#A855F7', due: 'Today', prio: 'Med',

    tips: ['Look at the shared calendar.', 'The number is in the planning doc.', 'Short and clear is kind.'] },

    steps: ['List the four launch dates', 'Draft one post idea per week', 'Assign owners', 'Share with Nijrika'],

    steps: ['Find the clinic number', 'Pick two free mornings', 'Call and book'],
    tips: ['It is in your contacts.', 'Tuesday or Thursday works.', 'Two minutes, tops.'] },

const taskById = (id) => TASKS.find((t) => t.id === id);

/* ---------- state ---------- */
const S = {
  view: 'window', phase: 'idle', taskId: null, steps: [], stepsLoading: false,
  focusSec: 25 * 60, breakSec: 5 * 60, elapsed: 0, running: false, speed: 1, sound: false,
  sessionsToday: 2, finishKind: null, completed: new Set(),

const listeners = {};
const on = (e, f) => (listeners[e] ||= []).push(f);
const emit = (e, ...a) => (listeners[e] || []).forEach((f) => f(...a));

const total = () => (S.phase === 'break' ? S.breakSec : S.focusSec);
const progress = () => Math.min(1, S.elapsed / total());
const remaining = () => Math.max(0, Math.ceil(total() - S.elapsed));
const fmt = (sec) => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
const fmt2 = (sec) => `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
const doneCount = () => S.steps.filter((s) => s.done).length;
const currentStep = () => S.steps.findIndex((s) => !s.done);
const task = () => taskById(S.taskId);

function encourage() {
  const d = doneCount(), n = S.steps.length;
  if (!n) return '';
  if (d === n) return 'Every step done.';
  if (n - d === 1) return 'Last one. Finish it off.';
  if (d / n >= .5) return 'Past halfway. Keep the pace.';
  if (d === 1) return 'Nice. One down.';
  return 'Good. On to the next.';
}
function finishLine() {
  if (S.finishKind === 'task') return 'Every step done. You finished the whole thing.';
  return `${Math.round(S.focusSec / 60)} minutes on one thing. That counts.`;
}

const Focus = {
  start(id) {
    if (S.phase !== 'idle') return;
    S.taskId = id; S.steps = []; S.stepsLoading = true; S.elapsed = 0; S.running = true; S.finishKind = null;
    S.phase = 'focus';
    emit('phase', 'idle', 'focus', {});

    setTimeout(() => {
      if (S.taskId !== id || !S.stepsLoading) return;
      S.steps = task().steps.map((title) => ({ title, done: false }));
      S.stepsLoading = false;
      emit('steps');
    }, RM ? 200 : 1300);
  },
  toggleRun() { if (S.phase === 'focus' || S.phase === 'break') { S.running = !S.running; emit('run'); } },
  toggleStep(i) {
    const s = S.steps[i]; if (!s || S.phase !== 'focus') return;
    s.done = !s.done; emit('step', i, s.done);
    if (s.done) chime('tick');
    if (S.steps.every((x) => x.done)) setTimeout(() => { if (S.phase === 'focus' && S.steps.every((x) => x.done)) Focus.finish('task'); }, RM ? 300 : 1000);
  },
  finish(kind) {
    const from = S.phase; S.running = false; S.finishKind = kind; S.sessionsToday += 1; S.phase = 'finish';
    emit('phase', from, 'finish', {}); chime('finish');

  takeBreak() { const from = S.phase; S.phase = 'break'; S.elapsed = 0; S.running = true; emit('phase', from, 'break', {}); },
  keepGoing() { const from = S.phase; S.phase = 'focus'; S.elapsed = 0; S.running = true; S.finishKind = null; emit('phase', from, 'focus', { again: true }); },
  markDone() { const from = S.phase; const id = S.taskId; S.phase = 'idle'; S.running = false; S.completed.add(id); emit('phase', from, 'idle', { completed: id }); },
  stop() { if (S.phase === 'idle') return; const from = S.phase; S.phase = 'idle'; S.running = false; emit('phase', from, 'idle', {}); },

/* ---------- timer loop ---------- */
let last = performance.now();
function loop(t) {
  const dt = Math.min(.25, (t - last) / 1000); last = t;
  if (S.running && (S.phase === 'focus' || S.phase === 'break')) {
    S.elapsed += dt * S.speed;
    if (S.elapsed >= total()) {
      S.elapsed = total();
      if (S.phase === 'focus') Focus.finish('time');
      else { S.phase = 'focus'; S.elapsed = 0; S.running = false; emit('phase', 'break', 'focus', { ready: true }); chime('soft'); }
    }
  }
  emit('tick', t);
  requestAnimationFrame(loop);
}

/* ---------- chime (WebAudio, off by default) ---------- */
let ac;
function chime(kind) {
  if (!S.sound) return;
  ac ||= new (window.AudioContext || window.webkitAudioContext)();
  const seq = { start: [[523.25, 0], [783.99, .09]], tick: [[1174.66, 0]], finish: [[523.25, 0], [659.25, .14], [783.99, .28], [1046.5, .42]], soft: [[659.25, 0], [987.77, .12]] }[kind];
  const len = kind === 'tick' ? .45 : 2.2;
  seq.forEach(([f, d]) => {
    [[f, 'sine', kind === 'tick' ? .045 : .07], [f * 2, 'triangle', .012]].forEach(([freq, type, vol]) => {

      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .012); g.gain.exponentialRampToValueAtTime(.0001, t0 + len);

    });
  });
}

/* ---------- animation helpers ---------- */
function rel(el, box) { const a = el.getBoundingClientRect(), b = box.getBoundingClientRect(); return { x: a.left - b.left, y: a.top - b.top, w: a.width, h: a.height }; }
/** Animate an absolutely-positioned box between two rects (left/top/width/height). */
function flyBox(el, from, to, { duration = 760, easing = 'cubic-bezier(.2,.8,.2,1)', delay = 0 } = {}) {
  if (RM) return el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1, fill: 'both' });
  const k = (r) => ({ left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });

/** Build the plant into an <svg>. Returns an updater. */
function buildPlant(svg) {
  svg.innerHTML = `
    <g clip-path="url(#aboveGround)"><circle class="p-sun" cx="170" cy="392" r="165" fill="url(#sunGrad)"/></g>
    ${[[40, 60], [290, 40], [250, 120], [70, 150], [310, 200], [20, 230]].map(([x, y], i) => `<circle class="p-star" cx="${x}" cy="${y}" r="1.4" style="animation-delay:${i * .5}s"/>`).join('')}

    <line class="p-ground" x1="-30" y1="392.5" x2="370" y2="392.5"/>
    <g class="p-sway">
      <path class="p-stem" d="${STEM_D}"/>
      <g class="p-leaves"></g>
      <g class="p-flower"><circle class="p-glow" r="70" fill="url(#glowGrad)"/><path class="p-bud" d="M0 4 C -7 0, -7 -10, 0 -18 C 7 -10, 7 0, 0 4z"/><g class="p-petals"></g><g class="p-inner"></g><circle class="p-core" r="5"/></g>
    </g>
    <circle class="p-seed" cx="170" cy="386" r="5" fill="var(--leaf-a)"/>`;
  const stem = svg.querySelector('.p-stem'); const L = stem.getTotalLength();
  stem.style.strokeDasharray = L; stem.style.strokeDashoffset = L;
  const lg = svg.querySelector('.p-leaves');
  LEAVES.forEach(([t, side, s]) => {
    const pt = stem.getPointAtLength(L * t);
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('transform', `translate(${pt.x} ${pt.y}) rotate(${side < 0 ? 200 : -20}) scale(${s})`);
    g.innerHTML = `<g class="p-leaf"><path d="M0 0 C 12 -15, 36 -16, 50 -3 C 36 9, 13 9, 0 0z"/><path class="rib" d="M2 0 C 18 -4, 32 -4, 46 -3"/></g>`;
    g.dataset.t = t; lg.appendChild(g);
  });
  const fl = svg.querySelector('.p-flower');
  let lastN = -1;
  return function update(growth, open, n, opts = {}) {
    stem.style.strokeDashoffset = L * (1 - growth);
    lg.querySelectorAll(':scope > g').forEach((g) => g.firstElementChild.classList.toggle('open', growth >= +g.dataset.t + .02));
    const tip = stem.getPointAtLength(L * growth);
    fl.style.transform = `translate(${tip.x}px, ${tip.y}px) scale(${(.55 + .45 * growth) * (opts.big ? 1.35 : 1)})`;
    fl.style.opacity = growth < .03 ? 0 : 1;
    const pg = fl.querySelector('.p-petals');
    if (n !== lastN) {
      pg.innerHTML = Array.from({ length: n }, (_, i) => `<g class="p-petal"><ellipse rx="9.5" ry="19" cy="-17"/></g>`).join(''); lastN = n;
      fl.querySelector('.p-inner').innerHTML = Array.from({ length: n }, () => `<g class="p-petal in"><ellipse rx="5.5" ry="11" cy="-10"/></g>`).join('');
    }
    const petals = [...pg.children];
    const f = n ? Math.min(1, open / n) : 0;
    petals.forEach((p, i) => {
      const a = (360 / n) * i;
      p.style.transform = `rotate(${a * (.08 + .92 * f)}deg) scale(${.42 + .58 * f}, ${.55 + .45 * f})`;
      p.style.opacity = f > 0 ? 1 : 0;
    });

    [...fl.querySelector('.p-inner').children].forEach((p, i) => { const a = (360 / n) * i + 30; p.style.transform = `rotate(${a * (.1 + .9 * f2)}deg) scale(${.3 + .7 * f2})`; p.style.opacity = f2 > 0 ? 1 : 0; });

    const p = opts.sunP ?? growth;

  };
}

    if (e.target.closest('#stopBtn')) Focus.stop();
    if (e.target.closest('#skipBtn')) S.elapsed = total();
    if (e.target.closest('#readyBtn')) { stage.classList.remove('ready'); S.running = true; emit('run'); }
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'done') Focus.markDone(); if (act === 'break') Focus.takeBreak(); if (act === 'again') Focus.keepGoing();
  });
  on('phase', (from, to, o) => {
    if (to === 'focus' && from === 'idle') enterFocus(o.instant);
    else if (to === 'focus') { fillCard(); setPhaseAttr(); stage.classList.toggle('ready', !!o.ready); $('#time').textContent = fmt(remaining()); setRunBtn(); renderGarden(false); if (!o.ready) { S._g = .07; note('A fresh 25 minutes. Keep growing.'); } drawPlant(); }
    else if (to === 'break') {
      if (o.instant) { fillCard(); renderSteps(false); Shell.setFocusing(true); stage.classList.add('on', 'lit'); Shell.row(S.taskId).classList.add('is-lifted'); S._g = .85; }
      setPhaseAttr(); setRunBtn(); drawPlant(); renderGarden(false); const c = currentStep(); $('#title').textContent = c >= 0 ? `Up next: ${S.steps[c].title}` : task().title; $('#time').textContent = fmt(remaining());
    }
    else if (to === 'finish') { if (o.instant) { fillCard(); renderSteps(false); Shell.setFocusing(true); stage.classList.add('on', 'lit'); Shell.row(S.taskId).classList.add('is-lifted'); S._g = Math.max(.8, .07 + .93 * (+(new URLSearchParams(location.hash.slice(1)).get('p') || .9))); } enterFinish(o.instant); setRunBtn(); }
    else if (to === 'idle') exitFocus(o);
    renderPanel();
  });
  on('steps', () => { morphHeight($('#wrap'), () => renderSteps(true)); drawPlant(); renderPanel(); });
  on('step', (i, done) => {
    updateCur(); drawPlant();
    if (done) {
      setTimeout(() => burst('spark', 10, $('#plant .p-core'), 46), 150);
      const c = currentStep(); if (c >= 0) note(`A petal opens. Next: ${S.steps[c].title.toLowerCase()}.`);
    }
    renderPanel();
  });
  on('run', () => { setRunBtn(); renderPanel(); });
  on('view', renderPanel);
  let lastSec = -1;
  on('tick', () => {
    if (S.phase === 'focus' || S.phase === 'break') {
      const r = remaining();
      if (r !== lastSec) { lastSec = r; $('#time').textContent = fmt(r); const pt = $('#pbTime'); if (pt) pt.textContent = fmt(r); if (S.phase === 'focus' && !S.stepsLoading) drawPlant(); else if (S.phase === 'focus' && stage.classList.contains('on')) drawPlant(); }
    }
    const mi = $('#mbItem');
    const txt = S.phase === 'focus' || S.phase === 'break' ? `${icon(S.phase === 'break' ? 'coffee' : 'sprout')}${Math.ceil(remaining() / 60)}m` : S.phase === 'finish' ? `${icon('sprout')}Grown` : icon('sprout');
    if (mi.dataset.k !== txt) { mi.innerHTML = txt; mi.dataset.k = txt; }
  });
}

/* -------- menu bar panel -------- */
function renderPanel() {
  const P = $('#mbPanel'); const t = task();
  const garden = `<div class="minis">${Array.from({ length: GARDEN_PAST + (S.phase === 'finish' ? 1 : 0) + (S._extra || 0) }, () => miniSVG()).join('')}</div><span class="lbl">${GARDEN_PAST + (S.phase === 'finish' ? 1 : 0) + (S._extra || 0)} today</span>`;
  updPanelPlant = null;
  if (S.phase === 'idle') {
    const list = TASKS.filter((x) => !S.completed.has(x.id)).slice(0, 3);
    P.innerHTML = `<div class="pb"><div class="pb-h">Grow something</div>${list.map((x) => `<div class="mb-row"><span style="width:7px;height:7px;border-radius:50%;background:${x.color}"></span><span class="t">${x.title}</span><button class="pb-row-btn" data-pstart="${x.id}" aria-label="Focus: ${x.title}">${icon('sprout')}</button></div>`).join('')}<div class="pb-foot">${garden}</div></div>`;
    return;
  }
  const c = currentStep(); const brk = S.phase === 'break', fin = S.phase === 'finish';
  P.innerHTML = `<div class="pb" data-phase="${S.phase}"><div class="pb-main"><svg class="pb-plant" id="pbPlant" viewBox="0 0 340 440"></svg><div style="min-width:0;flex:1">
    ${fin ? `<div style="font-size:15px;font-weight:600;line-height:1.35">${finishLine()}</div><div style="display:flex;gap:8px;margin-top:12px">${S.finishKind === 'task' ? `<button class="btn-gradient" style="height:32px" data-pact="done">Mark as done</button><button class="btn-soft" style="height:32px" data-pact="break">Break</button>` : `<button class="btn-gradient" style="height:32px" data-pact="break">Take a break</button><button class="btn-soft" style="height:32px" data-pact="again">Keep going</button>`}</div>`
      : `<div class="pb-time" id="pbTime" style="${S.running ? '' : 'opacity:.45'}">${fmt(remaining())}</div><div class="pb-title">${brk ? 'Break' : t.title}</div>
    ${brk ? `<div class="pb-step">Stretch, drink some water.</div>` : S.stepsLoading ? `<div class="pb-step">${icon('sparkle')}Breaking it into steps</div>` : c >= 0 ? `<div class="pb-step"><button class="sc" data-pstep="${c}" aria-label="Complete: ${S.steps[c].title}"></button>${S.steps[c].title}</div>` : ''}`}
    </div></div><div class="pb-foot">${garden}<span class="grow"></span>${fin ? '' : `${brk ? '' : `<button class="icon-btn" data-pact="stop" aria-label="End session">${icon('stop')}</button>`}<button class="icon-btn" data-pact="run" aria-label="${S.running ? 'Pause' : 'Resume'}">${icon(S.running ? 'pause' : 'play')}</button>`}</div></div>`;
  updPanelPlant = buildPlant($('#pbPlant'));
  $('#pbPlant').classList.toggle('brk', brk);
  drawPlant();
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('#mbPanel')) return;
  const st = e.target.closest('[data-pstart]'); if (st) Focus.start(st.dataset.pstart);
  const sp = e.target.closest('[data-pstep]'); if (sp) Focus.toggleStep(+sp.dataset.pstep);
  const a = e.target.closest('[data-pact]')?.dataset.pact;
  if (a === 'run') Focus.toggleRun(); if (a === 'stop') Focus.stop(); if (a === 'done') Focus.markDone(); if (a === 'break') Focus.takeBreak(); if (a === 'again') Focus.keepGoing();
});

boot(initB);
</script>
</body>
</html>
