<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stride Focus: A, Still</title>
<style>
/* ---------- Stride Soft UI tokens ---------- */
:root {
  color-scheme: light;
  --bg: #F0F4F8;
  --sidebar: #EAEEF5;
  --surface: #FFFFFF;
  --well: #E9EEF4;
  --shadow-light: #FFFFFF;
  --shadow-dark: #D1D9E6;
  --fg: #1F2937;
  --muted: #4B5563;
  --tertiary: #6B7280;
  --border: rgba(209, 217, 230, .6);
  --accent: #4F46E5;
  --accent-rgb: 79 70 229;
  --accent-2: #7C5CF0;
  --accent-soft: rgba(79, 70, 229, .12);
  --accent-text: #4338CA;
  --success: #22C55E;
  --success-text: #15803D;
  --danger-text: #B91C1C;
  --danger-soft: rgba(239, 68, 68, .10);
  --warning-text: #C2410C;
  --raised: -6px -6px 15px var(--shadow-light), 6px 6px 15px var(--shadow-dark);
  --raised-sm: -3px -3px 8px var(--shadow-light), 3px 3px 8px var(--shadow-dark);
  --inset: inset -4px -4px 10px var(--shadow-light), inset 4px 4px 10px var(--shadow-dark);
  --wall: radial-gradient(1200px 700px at 15% 10%, #DCE3F6 0%, transparent 60%), radial-gradient(900px 700px at 90% 90%, #E7DDF7 0%, transparent 60%), #E4E9F2;
  --scrim: rgba(240, 244, 248, .55);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --ease-soft: cubic-bezier(.4, 0, .2, 1);
  --spring: cubic-bezier(.34, 1.4, .64, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #14161C; --sidebar: #181B22; --surface: #1E222A; --well: #171A20;
    --shadow-light: rgba(255,255,255,.04); --shadow-dark: rgba(0,0,0,.45);
    --fg: #F3F4F6; --muted: #A1A8B5; --tertiary: #8A92A0; --border: rgba(255,255,255,.08);
    --accent: #6366F1; --accent-rgb: 99 102 241; --accent-2: #8B6CF6;
    --accent-soft: rgba(99, 102, 241, .20); --accent-text: #A5B4FC;
    --success-text: #4ADE80; --danger-text: #F87171; --danger-soft: rgba(248,113,113,.14); --warning-text: #FB923C;
    --raised: 0 1px 0 rgba(255,255,255,.05) inset, 0 6px 18px rgba(0,0,0,.35);
    --raised-sm: 0 1px 0 rgba(255,255,255,.04) inset, 0 3px 10px rgba(0,0,0,.3);
    --inset: inset 2px 2px 6px rgba(0,0,0,.45), inset -1px -1px 2px rgba(255,255,255,.04);
    --wall: radial-gradient(1200px 700px at 15% 10%, #1D2240 0%, transparent 60%), radial-gradient(900px 700px at 90% 90%, #2A1D3F 0%, transparent 60%), #0D0F14;
    --scrim: rgba(20, 22, 28, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14161C; --sidebar: #181B22; --surface: #1E222A; --well: #171A20;
  --shadow-light: rgba(255,255,255,.04); --shadow-dark: rgba(0,0,0,.45);
  --fg: #F3F4F6; --muted: #A1A8B5; --tertiary: #8A92A0; --border: rgba(255,255,255,.08);
  --accent: #6366F1; --accent-rgb: 99 102 241; --accent-2: #8B6CF6;
  --accent-soft: rgba(99, 102, 241, .20); --accent-text: #A5B4FC;
  --success-text: #4ADE80; --danger-text: #F87171; --danger-soft: rgba(248,113,113,.14); --warning-text: #FB923C;
  --raised: 0 1px 0 rgba(255,255,255,.05) inset, 0 6px 18px rgba(0,0,0,.35);
  --raised-sm: 0 1px 0 rgba(255,255,255,.04) inset, 0 3px 10px rgba(0,0,0,.3);
  --inset: inset 2px 2px 6px rgba(0,0,0,.45), inset -1px -1px 2px rgba(255,255,255,.04);
  --wall: radial-gradient(1200px 700px at 15% 10%, #1D2240 0%, transparent 60%), radial-gradient(900px 700px at 90% 90%, #2A1D3F 0%, transparent 60%), #0D0F14;
  --scrim: rgba(20, 22, 28, .5);
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.3 var(--font); color: var(--fg); background: var(--wall); background-attachment: fixed; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.ic { width: 16px; height: 16px; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.tnum { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.btn-gradient { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 16px; border-radius: 10px; color: #fff; font-weight: 600; font-size: 13px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 4px 14px rgb(var(--accent-rgb) / .35); transition: transform .2s var(--ease), filter .2s, box-shadow .2s; }
.btn-gradient:hover { transform: translateY(-1px); filter: brightness(1.04); }
.btn-gradient:active { transform: none; box-shadow: 0 2px 6px rgb(var(--accent-rgb) / .3); }
.btn-soft { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 10px; font-weight: 500; font-size: 13px; color: var(--muted);
  background: var(--surface); box-shadow: var(--raised-sm); border: 1px solid var(--border); transition: color .2s, transform .2s var(--ease); }
.btn-soft:hover { color: var(--fg); transform: translateY(-1px); }
.btn-text { height: 32px; padding: 0 10px; border-radius: 8px; font-size: 13px; color: var(--tertiary); transition: color .2s, background .2s; }
.btn-text:hover { color: var(--fg); background: var(--well); }
.icon-btn { width: 40px; height: 40px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); transition: color .2s, background .2s, transform .2s var(--ease); }
.icon-btn:hover { color: var(--fg); background: rgb(127 127 127 / .12); }
.icon-btn:active { transform: scale(.94); }

/* ---------- desk + window ---------- */
.desk { position: fixed; inset: 0; padding: 22px; display: flex; }
.window { position: relative; flex: 1; border-radius: 14px; overflow: hidden; background: var(--bg); box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 24px 70px rgba(15, 20, 40, .28); isolation: isolate; }
.lights { position: absolute; left: 18px; top: 18px; display: flex; gap: 8px; z-index: 30; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15); }
.lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
.app { position: absolute; inset: 0; display: flex; transform-origin: 50% 40%;
  transition: filter 1s var(--ease), opacity 1s var(--ease), transform 1.1s var(--ease); }
.window.is-focusing .app { filter: blur(16px) saturate(.15); opacity: .38; transform: scale(.975); pointer-events: none; }
.window.is-focusing .lights { opacity: .5; transition: opacity 1s; }

.sidebar { width: 248px; flex: none; padding: 54px 14px 16px; background: var(--sidebar); position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
.sidebar::after { content: ""; position: absolute; left: -80px; bottom: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgb(var(--accent-rgb) / .16), transparent 70%); pointer-events: none; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; letter-spacing: -.01em; padding: 0 6px 14px; }
.mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; color: #fff; box-shadow: 0 4px 12px rgb(var(--accent-rgb) / .35); }
.mark .ic { width: 17px; height: 17px; stroke-width: 2.6; }
.capture { display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--surface); box-shadow: var(--raised-sm); margin-bottom: 14px; font-weight: 500; }
.capture kbd, .search kbd { margin-left: auto; font: 12px var(--font); color: var(--tertiary); }
.navgroup { font-size: 12px; font-weight: 600; color: var(--tertiary); padding: 12px 10px 6px; }
.navitem { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 10px; color: var(--fg); }
.navitem .ic { color: var(--muted); width: 17px; height: 17px; }
.navitem .n { margin-left: auto; color: var(--tertiary); font-size: 13px; font-variant-numeric: tabular-nums; }
.navitem.sel { background: var(--accent-soft); font-weight: 600; }
.navitem.sel .ic { color: var(--accent-text); }

.content { flex: 1; min-width: 0; padding: 14px 30px 30px; overflow: hidden; display: flex; flex-direction: column; }
.toolbar { display: flex; align-items: center; gap: 10px; height: 40px; margin-bottom: 26px; }
.search { display: flex; align-items: center; gap: 9px; width: 420px; height: 36px; padding: 0 12px; border-radius: 10px; background: var(--well); box-shadow: var(--inset); color: var(--tertiary); font-size: 13.5px; }
.grow { flex: 1; }
.vh { display: flex; align-items: baseline; gap: 12px; }
.vh h1 { margin: 0; font-size: 30px; line-height: 36px; letter-spacing: -.02em; }
.vh .count { color: var(--muted); font-size: 15px; }
.vh-sub { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin: 12px 0 8px; }
.pbar { height: 6px; border-radius: 99px; background: var(--well); box-shadow: var(--inset); overflow: hidden; margin-bottom: 20px; }
.pbar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .8s var(--ease); }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.row { position: relative; display: flex; align-items: flex-start; gap: 14px; padding: 15px 16px; border-radius: 14px; background: var(--surface); box-shadow: var(--raised-sm); transition: background .2s, box-shadow .25s, transform .25s var(--ease), opacity .4s, max-height .5s var(--ease), padding .5s var(--ease), margin .5s var(--ease); max-height: 120px; }
.row:hover, .row.hover { box-shadow: var(--raised); }
.row.is-lifted { visibility: hidden; }
.cb { width: 22px; height: 22px; flex: none; margin-top: 1px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--tertiary); display: grid; place-items: center; color: #fff; transition: box-shadow .2s, background .3s; }
.cb .ic { width: 13px; height: 13px; stroke-width: 3; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .35s .1s var(--ease); }
.row .cb:hover { box-shadow: inset 0 0 0 1.5px var(--accent); }
.row.done .cb { background: var(--accent); box-shadow: none; animation: cbpop .45s var(--spring); }
.row.done .cb .ic { stroke-dashoffset: 0; }
.row.done .row-title { color: var(--tertiary); text-decoration: line-through; text-decoration-color: var(--tertiary); }
.row.gone { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; margin-bottom: -10px; overflow: hidden; }
@keyframes cbpop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 15px; line-height: 20px; font-weight: 600; transition: color .3s; }
.row-note { font-size: 14px; color: var(--muted); margin-top: 2px; }
.chips { display: flex; gap: 8px; margin-top: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--well); font-size: 12.5px; color: var(--muted); }
.chip i { width: 7px; height: 7px; border-radius: 50%; }
.chip.today { background: var(--accent-soft); color: var(--accent-text); }
.chip .ic { width: 13px; height: 13px; }
.row-end { position: relative; align-self: center; display: flex; align-items: center; gap: 8px; }
.prio { height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; background: var(--danger-soft); color: var(--danger-text); transition: opacity .2s; }
.prio.med { background: rgba(234, 88, 12, .1); color: var(--warning-text); }
.prio.low { background: var(--well); color: var(--tertiary); }

/* ---------- stage (option fills) ---------- */
.stage { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
.window.is-focusing .stage { pointer-events: auto; }

/* ---------- menubar view ---------- */
.mbview { position: fixed; inset: 0; display: none; align-items: flex-start; justify-content: center; padding-top: 40px; }
body.view-menubar .desk { display: none; }
body.view-menubar .mbview { display: flex; }
.mb-scene { position: relative; width: 600px; height: 380px; border-radius: 16px; overflow: hidden; background: var(--wall); box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 20px 60px rgba(15,20,40,.22); }
.mb-strip { height: 30px; display: flex; align-items: center; gap: 16px; padding: 0 14px; font-size: 13px; font-weight: 500; color: var(--fg); background: rgb(255 255 255 / .45); backdrop-filter: blur(20px); }
:root[data-theme="dark"] .mb-strip { background: rgb(20 22 28 / .55); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mb-strip { background: rgb(20 22 28 / .55); } }
.mb-strip .r { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.mb-strip .ic { width: 15px; height: 15px; }
.mb-item { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; background: rgb(127 127 127 / .2); font-variant-numeric: tabular-nums; }
.mb-panel { position: absolute; top: 38px; right: 92px; width: 380px; border-radius: 14px; overflow: hidden; background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(30px) saturate(1.4);
  box-shadow: 0 0 0 .5px rgba(0,0,0,.15), 0 18px 50px rgba(15,20,40,.28); }
.mb-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; transition: background .2s; }
.mb-row:hover { background: rgb(127 127 127 / .1); }
.mb-row .t { flex: 1; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mb-row .p { font-size: 12px; color: var(--tertiary); }

/* ---------- prototype controls ---------- */
.proto { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 12px; font-size: 12px;
  background: rgb(20 22 30 / .78); color: #E5E7EB; backdrop-filter: blur(16px); box-shadow: 0 6px 24px rgba(0,0,0,.25); opacity: .35; transition: opacity .25s; }
.proto:hover, .proto:focus-within { opacity: 1; }
.proto .lbl { padding: 0 6px 0 8px; color: #9CA3AF; }
.proto button { height: 26px; padding: 0 9px; border-radius: 8px; color: #D1D5DB; }
.proto button:hover { background: rgba(255,255,255,.08); }
.proto button.on { background: rgba(255,255,255,.16); color: #fff; }
.proto .sep { width: 1px; height: 16px; background: rgba(255,255,255,.15); margin: 0 4px; }
body.shot .proto { display: none; }
body.instant *, body.instant *::before, body.instant *::after { transition: none !important; animation-delay: -10s !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  .window.is-focusing .app { transform: none; }
}


/* ================= Option A: Still (typographic + ambient light) ================= */
.start-btn { position: absolute; right: 0; top: 50%; transform: translateY(-50%) scale(.96); opacity: 0; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 10px; border-radius: 999px;
  font-size: 13px; font-weight: 600; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 4px 14px rgb(var(--accent-rgb) / .35); transition: opacity .2s, transform .25s var(--ease); white-space: nowrap; }
.start-btn .ic { width: 12px; height: 12px; }
.row:hover .start-btn, .row.hover .start-btn, .start-btn:focus-visible { opacity: 1; transform: translateY(-50%); }
.row:hover .prio, .row.hover .prio { opacity: 0; }

.a-amb { position: absolute; inset: -10%; opacity: 0; transition: opacity 1.4s var(--ease), filter 1s; filter: blur(70px) saturate(1.1); }
.stage.lit .a-amb { opacity: 1; }
.a-center { opacity: 0; visibility: hidden; transition: opacity .4s, visibility 0s .4s; }
.stage.on .a-center { opacity: 1; visibility: visible; transition: opacity .3s; }
.a-amb i { position: absolute; border-radius: 50%; mix-blend-mode: normal; transition: background 2.5s linear; }
.a-amb .b1 { width: 60%; height: 70%; left: 8%; top: 4%; animation: drift1 38s ease-in-out infinite alternate; }
.a-amb .b2 { width: 55%; height: 65%; right: 4%; top: 20%; animation: drift2 46s ease-in-out infinite alternate; }
.a-amb .b3 { width: 50%; height: 55%; left: 30%; bottom: -6%; animation: drift3 52s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(18%, 12%) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-16%, -10%) scale(.9); } }
@keyframes drift3 { to { transform: translate(-12%, -14%) scale(1.2); } }
.stage.paused .a-amb i { animation-play-state: paused; }
.stage.paused .a-amb { filter: blur(70px) saturate(.35); }
.a-amb.pulse { animation: ambpulse 1.4s var(--ease-soft); }
@keyframes ambpulse { 30% { filter: blur(70px) saturate(1.5) brightness(1.18); } }
.a-veil { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 1.2s; }
.stage.lit .a-veil { opacity: 1; }

.a-bloom { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: radial-gradient(circle, rgb(var(--accent-rgb) / .55), rgb(var(--accent-rgb) / 0) 70%); opacity: 0; pointer-events: none; }

.a-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 36px; }
.a-top { position: relative; height: 172px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.a-time { font-family: var(--display); font-weight: 200; font-size: 136px; line-height: 1; letter-spacing: -.045em; font-variant-numeric: tabular-nums; display: flex; color: var(--fg); transition: opacity .5s; }
.a-time .d { display: inline-block; min-width: .56em; text-align: center; }
.a-time .c { display: inline-block; width: .26em; text-align: center; opacity: .35; transform: translateY(-.07em); }
.stage.paused .a-time { opacity: .42; }
.stage.paused .a-time .c { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .1; } }
.a-sub { height: 22px; margin-top: 8px; font-size: 14px; color: var(--muted); letter-spacing: .01em; opacity: 0; transition: opacity .8s; }
.a-sub.show { opacity: 1; }
.a-mark { position: absolute; bottom: 4px; width: 92px; height: 92px; opacity: 0; color: var(--accent-text); }
.a-mark circle, .a-mark path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.a-mark circle { stroke-dasharray: 283; stroke-dashoffset: 283; opacity: .5; }
.a-mark path { stroke-width: 2.4; stroke-dasharray: 60; stroke-dashoffset: 60; }
.stage[data-phase="finish"] .a-time, .stage[data-phase="finish"] .a-sub { opacity: 0; }
.stage[data-phase="finish"] .a-mark { opacity: 1; transition: opacity .4s .3s; }
.stage[data-phase="finish"] .a-mark circle { stroke-dashoffset: 0; transition: stroke-dashoffset 1.1s .4s var(--ease); }
.stage[data-phase="finish"] .a-mark path { stroke-dashoffset: 0; transition: stroke-dashoffset .6s 1.2s var(--ease); }

.a-card { position: relative; width: 540px; margin-top: 30px; padding: 22px 24px 18px; border-radius: 22px; background: color-mix(in srgb, var(--surface) 78%, transparent);
  backdrop-filter: blur(28px) saturate(1.3); box-shadow: 0 1px 0 rgb(255 255 255 / .35) inset, 0 24px 60px rgba(15, 20, 40, .14), 0 0 0 .5px var(--border); transition: background .4s, box-shadow .4s; }
.a-ghost { position: absolute; display: none; border-radius: 22px; background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(28px); box-shadow: 0 24px 60px rgba(15, 20, 40, .16); }
.a-card.flying { background: transparent; box-shadow: none; backdrop-filter: none; }
.a-card.flying, .a-card.flying > * { transition: none !important; }
.a-card.loading .a-foot { opacity: 0; }
.a-card.flying > *:not(.a-title) { opacity: 0; }
.a-card > * { transition: opacity .45s var(--ease); }
.a-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.a-head .dot { width: 7px; height: 7px; border-radius: 50%; }
.a-head .count { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--tertiary); }
.a-title { margin: 8px 0 0; font-size: 22px; line-height: 28px; font-weight: 650; letter-spacing: -.012em; display: flex; align-items: center; }
.a-title .tick { width: 0; overflow: hidden; color: var(--accent-text); display: inline-flex; transition: width .4s var(--ease); }

.a-title .tick .ic { width: 22px; height: 22px; stroke-width: 2.4; }
.a-wrap { overflow: hidden; }
.a-steps { list-style: none; margin: 14px 0 0; padding: 0; }
.a-step { display: flex; align-items: center; gap: 12px; min-height: 42px; color: var(--tertiary); font-size: 14.5px; transition: color .4s; }
.a-step.cur { color: var(--fg); }
.a-step .sc { position: relative; width: 22px; height: 22px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; display: grid; place-items: center; color: inherit; transition: background .35s var(--ease), box-shadow .3s, transform .2s; }

const PAL = {
  focus: [[[99, 102, 241], [139, 92, 246], [56, 189, 248]], [[139, 92, 246], [236, 72, 153], [99, 102, 241]], [[244, 114, 182], [251, 146, 60], [168, 85, 247]]],
  brk: [[[45, 212, 191], [34, 197, 94], [56, 189, 248]]],

const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));

  const st = PAL.focus, x = p * (st.length - 1), i = Math.min(st.length - 2, Math.floor(x));

      <div class="pa-title">${brk ? 'Break' : t.title}</div>
      ${brk ? `<div style="text-align:center;color:var(--muted);font-size:13px;margin-top:4px">Stand up and stretch.</div>` : S.stepsLoading ? `<div class="pa-step" style="color:var(--tertiary)">${icon('sparkle')}Breaking it into steps</div>` : c >= 0 ? `<div class="pa-step"><button class="sc" data-pstep="${c}" aria-label="Complete: ${S.steps[c].title}">${icon('check')}</button><span>${S.steps[c].title}</span><span class="n">${doneCount() + 1}/${S.steps.length}</span></div>` : ''}
      <div class="pa-ctl">${brk ? '' : `<button class="icon-btn" data-pact="stop" aria-label="End session" style="color:var(--muted)">${icon('stop')}</button>`}<button class="icon-btn" data-pact="run" aria-label="${S.running ? 'Pause' : 'Resume'}" style="background:color-mix(in srgb,var(--surface) 70%,transparent);box-shadow:var(--raised-sm)">${icon(S.running ? 'pause' : 'play')}</button></div></div>`;
  }
  paintAmbient(true);
}
document.addEventListener('click', (e) => {
  const P = e.target.closest('#mbPanel'); if (!P) return;
  const st = e.target.closest('[data-pstart]'); if (st) Focus.start(st.dataset.pstart);
  const sp = e.target.closest('[data-pstep]'); if (sp) Focus.toggleStep(+sp.dataset.pstep);
  const a = e.target.closest('[data-pact]')?.dataset.pact;
  if (a === 'run') Focus.toggleRun(); if (a === 'stop') Focus.stop(); if (a === 'done') Focus.markDone(); if (a === 'break') Focus.takeBreak(); if (a === 'again') Focus.keepGoing();
});

boot(initA);
</script>
</body>
</html>
