services:
  stride-cloud:


    user: "0:0"
    environment:
      STRIDE_CLOUD_AUTH_TOKENS_FILE: /run/secrets/stride_cloud_tokens
    secrets:
      - source: stride_cloud_tokens
        target: stride_cloud_tokens

secrets:
  stride_cloud_tokens:
    file: ${STRIDE_CLOUD_AUTH_TOKENS_FILE_HOST:?STRIDE_CLOUD_AUTH_TOKENS_FILE_HOST must name the host token file}
