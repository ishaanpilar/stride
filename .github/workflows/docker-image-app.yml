# NOTE: Manual-only. This workflow was inherited from the upstream project's store
# and registry release pipeline. Configure Stride's own store accounts, registry
# credentials and secrets before enabling automatic triggers.
name: Docker Image (app)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g., v0.6.3)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-image:
    uses: ./.github/workflows/docker-image-reusable.yml
    with:
      image_name: stride-app
      dockerfile: ./docker/app/Dockerfile
      tag: ${{ github.event.inputs.tag || '' }}
