name: Release Windows

# Builds the Windows x64 installers for an existing Stride release and attaches them to it.
#
# Run it after the macOS release for the tag is published (scripts/release-mac.ts --publish):
#   gh workflow run release-windows.yml --repo ishaanpilar/stride -f tag=v1.6.0
#
# Assets: Stride_<version>_x64-setup.exe (NSIS, recommended) and Stride_<version>_x64_en-US.msi, plus
# SHA-256 lines appended to the release's SHA256SUMS.txt.
#
# In-app updates (optional): when the repository secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD exist, the build signs the NSIS installer for the Tauri updater,
# checks the signature against the public key in tauri.conf.json, and adds a "windows-x86_64" entry to
# the release's latest.json. Without them latest.json is left alone and Windows users update by
# downloading the new installer (the app offers "Download from GitHub").
#
# Authenticode (optional, off by default): set the repository variable WINDOWS_CODE_SIGNING to
# "azure-trusted-signing" plus the variables and secrets listed on the "Prepare Authenticode signing"
# step. See docs/development/releasing.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, e.g. v1.6.0 (the GitHub release must already exist)"
        required: true
        type: string
      prerelease_note:
        description: "Optional text appended once to the release notes, e.g. a note that Windows is a beta"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 installers
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag and release
        id: version
        shell: pwsh
        run: |
          $tag = ([string]$env:RELEASE_TAG).Trim()
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "tag must look like v1.6.0, got '$tag'."
          }
          $version = $Matches[1]
          gh release view $tag --json tagName,isDraft | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "No GitHub release for $tag in $env:GH_REPO. Publish the macOS release first (scripts/release-mac.ts --publish)."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "setup_name=Stride_${version}_x64-setup.exe" >> $env:GITHUB_OUTPUT
          "msi_name=Stride_${version}_x64_en-US.msi" >> $env:GITHUB_OUTPUT

      - name: Checkout tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}

      - name: Check the tag's app version
        shell: pwsh
        run: |
          $config = Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json
          if ([string]$config.version -ne '${{ steps.version.outputs.version }}') {
            throw "tauri.conf.json at ${{ steps.version.outputs.tag }} says $($config.version), not ${{ steps.version.outputs.version }}."
          }
          if ([string]$config.productName -ne 'Stride') {
            throw "productName must be Stride so the assets are named Stride_<version>_x64-setup.exe."
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: apps/desktop/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        shell: pwsh
        run: |
          node scripts/ci/prepare-windows-bun-install.js
          $cacheDir = Join-Path $env:RUNNER_TEMP 'bun-install-cache-1'
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          bun install --frozen-lockfile --cache-dir "$cacheDir" --backend copyfile --network-concurrency 8
          if ($LASTEXITCODE -ne 0) {
            Write-Host "bun install failed, retrying from clean project and cache directories..."
            if (Test-Path node_modules) {
              Remove-Item node_modules -Recurse -Force
            }
            $cacheDir = Join-Path $env:RUNNER_TEMP 'bun-install-cache-2'
            if (Test-Path $cacheDir) {
              Remove-Item $cacheDir -Recurse -Force
            }
            New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
            bun install --frozen-lockfile --cache-dir "$cacheDir" --backend copyfile --network-concurrency 1 --concurrent-scripts 1
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Detect updater signing key
        id: updater
        shell: pwsh
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          $enabled = ($env:HAS_KEY -eq 'true' -and $env:HAS_PASSWORD -eq 'true')
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($enabled) {
            Write-Host "Updater signing secrets found: building signed updater artifacts."
          } else {
            Write-Host "::notice::TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD are not set: no Windows in-app update; latest.json stays unchanged."
          }

      # Optional, off by default. Enable with repository variable WINDOWS_CODE_SIGNING=azure-trusted-signing,
      # variables AZURE_TRUSTED_SIGNING_ENDPOINT / _ACCOUNT / _PROFILE and secrets AZURE_CLIENT_ID,
      # AZURE_CLIENT_SECRET, AZURE_TENANT_ID. Tauri then signs stride.exe, the NSIS installer and the MSI
      # through bundle.windows.signCommand before the updater signature is made.
      - name: Prepare Authenticode signing
        id: authenticode
        if: ${{ vars.WINDOWS_CODE_SIGNING == 'azure-trusted-signing' }}
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          HAS_AZURE_SECRETS: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_TENANT_ID != '' }}
        run: |
          if (-not $env:SIGNING_ENDPOINT -or -not $env:SIGNING_ACCOUNT -or -not $env:SIGNING_PROFILE -or $env:HAS_AZURE_SECRETS -ne 'true') {
            throw "WINDOWS_CODE_SIGNING is azure-trusted-signing but the Azure Trusted Signing variables or secrets are missing."
          }
          cargo install trusted-signing-cli --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $config = @{
            bundle = @{
              windows = @{
                signCommand = @{
                  cmd = 'trusted-signing-cli'
                  args = @('-e', $env:SIGNING_ENDPOINT, '-a', $env:SIGNING_ACCOUNT, '-c', $env:SIGNING_PROFILE, '-d', 'Stride', '%1')
                }
              }
            }
          }
          $path = Join-Path $env:RUNNER_TEMP 'tauri.windows-signing.conf.json'
          $config | ConvertTo-Json -Depth 6 | Set-Content -Path $path -Encoding utf8
          "config=$path" >> $env:GITHUB_OUTPUT

      - name: Build installers
        timeout-minutes: 60
        shell: pwsh
        env:
          UPDATER_SIGNING: ${{ steps.updater.outputs.enabled }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.updater.outputs.enabled == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.updater.outputs.enabled == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          AUTHENTICODE_CONFIG: ${{ steps.authenticode.outputs.config }}
          AZURE_CLIENT_ID: ${{ steps.authenticode.outputs.config != '' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.authenticode.outputs.config != '' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ steps.authenticode.outputs.config != '' && secrets.AZURE_TENANT_ID || '' }}
          # whisper.cpp: portable x86-64 code, not tuned to the CI machine's CPU.
          GGML_NATIVE: "OFF"
          GGML_AVX2: "OFF"
          GGML_FMA: "OFF"
          GGML_F16C: "OFF"
          GGML_BMI2: "OFF"
        run: |
          # A cached whisper-rs-sys build directory can point at a stale cmake tree.
          if (Test-Path apps/desktop/src-tauri/target) {
            Get-ChildItem -Path apps/desktop/src-tauri/target -Recurse -Directory -Filter 'whisper-rs-sys-*' |
              Where-Object { $_.Parent.Name -eq 'build' } |
              Remove-Item -Recurse -Force
          }
          $bundleDir = "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          Remove-Item -Recurse -Force $bundleDir -ErrorAction SilentlyContinue
          $tauriArgs = @('tauri', 'build', '--target', 'x86_64-pc-windows-msvc', '--bundles', 'nsis,msi')
          if ($env:UPDATER_SIGNING -eq 'true') {
            $tauriArgs += @('--config', 'src-tauri/tauri.updater.conf.json')
          } else {
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY, Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          if ($env:AUTHENTICODE_CONFIG) {
            $tauriArgs += @('--config', $env:AUTHENTICODE_CONFIG)
          }
          Set-Location apps/desktop
          Write-Host "bunx $($tauriArgs -join ' ')"
          bunx @tauriArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect installers
        id: assets
        shell: pwsh
        env:
          UPDATER_SIGNING: ${{ steps.updater.outputs.enabled }}
          AUTHENTICODE: ${{ steps.authenticode.outputs.config != '' }}
          SETUP_NAME: ${{ steps.version.outputs.setup_name }}
          MSI_NAME: ${{ steps.version.outputs.msi_name }}
        run: |
          $bundleDir = "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $setups = @(Get-ChildItem -LiteralPath "$bundleDir/nsis" -Filter '*.exe' -File -ErrorAction SilentlyContinue)
          $msis = @(Get-ChildItem -LiteralPath "$bundleDir/msi" -Filter '*.msi' -File -ErrorAction SilentlyContinue)
          if ($setups.Count -ne 1 -or $setups[0].Name -ne $env:SETUP_NAME) {
            throw "Expected exactly one NSIS installer named $env:SETUP_NAME; found: $(($setups | ForEach-Object Name) -join ', ')"
          }
          if ($msis.Count -ne 1 -or $msis[0].Name -ne $env:MSI_NAME) {
            throw "Expected exactly one MSI named $env:MSI_NAME; found: $(($msis | ForEach-Object Name) -join ', ')"
          }
          $out = Join-Path $env:GITHUB_WORKSPACE 'dist-windows'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -LiteralPath $setups[0].FullName, $msis[0].FullName -Destination $out
          if ($env:UPDATER_SIGNING -eq 'true') {
            $sig = "$($setups[0].FullName).sig"
            if (-not (Test-Path -LiteralPath $sig)) { throw "Updater signing was on but $sig is missing." }
            Copy-Item -LiteralPath $sig -Destination $out
          }
          if ($env:AUTHENTICODE -eq 'true') {
            foreach ($file in @((Join-Path $out $env:SETUP_NAME), (Join-Path $out $env:MSI_NAME))) {
              $signature = Get-AuthenticodeSignature -LiteralPath $file
              if ($signature.Status -ne 'Valid') { throw "Authenticode signature on $file is $($signature.Status)." }
              Write-Host "$file signed by $($signature.SignerCertificate.Subject)"
            }
          }
          Get-ChildItem $out | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          "dir=$out" >> $env:GITHUB_OUTPUT

      - name: Keep installers as a workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: stride-windows-${{ steps.version.outputs.tag }}
          path: dist-windows/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload installers to the release
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath "${{ steps.assets.outputs.dir }}" -File | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @files --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add Windows to latest.json and SHA256SUMS.txt
        shell: pwsh
        env:
          UPDATER_SIGNING: ${{ steps.updater.outputs.enabled }}
          VERSION: ${{ steps.version.outputs.version }}
          SETUP_NAME: ${{ steps.version.outputs.setup_name }}
          MSI_NAME: ${{ steps.version.outputs.msi_name }}
        run: |
          $dist = "${{ steps.assets.outputs.dir }}"
          $meta = Join-Path $env:RUNNER_TEMP 'release-meta'
          New-Item -ItemType Directory -Force -Path $meta | Out-Null
          $upload = @()
          $hashed = @((Join-Path $dist $env:SETUP_NAME), (Join-Path $dist $env:MSI_NAME))

          if ($env:UPDATER_SIGNING -eq 'true') {
            gh release download $env:RELEASE_TAG --pattern latest.json --dir $meta --clobber
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $meta 'latest.json'))) {
              Write-Host "::warning::$env:RELEASE_TAG has no latest.json (publish the macOS release first). Windows in-app updates were not added."
            } else {
              # Installers are already uploaded, so the manifest never points at a missing asset.
              bun scripts/add-windows-updater-entry.ts `
                --manifest (Join-Path $meta 'latest.json') `
                --version $env:VERSION `
                --signature-file (Join-Path $dist "$env:SETUP_NAME.sig") `
                --verify (Join-Path $dist $env:SETUP_NAME)
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $upload += (Join-Path $meta 'latest.json')
              $hashed += (Join-Path $meta 'latest.json')
            }
          } else {
            Write-Host "Updater signing is off: latest.json is unchanged."
          }

          gh release download $env:RELEASE_TAG --pattern SHA256SUMS.txt --dir $meta --clobber
          if ($LASTEXITCODE -ne 0) { Write-Host "No SHA256SUMS.txt on the release yet; starting one." }
          bun scripts/upsert-sha256sums.ts (Join-Path $meta 'SHA256SUMS.txt') @hashed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $upload += (Join-Path $meta 'SHA256SUMS.txt')

          gh release upload $env:RELEASE_TAG @upload --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Append the release note
        if: ${{ inputs.prerelease_note != '' }}
        shell: pwsh
        env:
          PRERELEASE_NOTE: ${{ inputs.prerelease_note }}
        run: |
          $body = (gh release view $env:RELEASE_TAG --json body --jq .body | Out-String).TrimEnd()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $note = $env:PRERELEASE_NOTE.Trim()
          if ($body.Contains($note)) {
            Write-Host "The release notes already contain the note."
            exit 0
          }
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesFile -Encoding utf8 -Value "$body`n`n$note"
          gh release edit $env:RELEASE_TAG --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Summary
        if: ${{ always() && steps.assets.outputs.dir != '' }}
        shell: pwsh
        env:
          UPDATER_SIGNING: ${{ steps.updater.outputs.enabled }}
          AUTHENTICODE: ${{ steps.authenticode.outputs.config != '' }}
        run: |
          $lines = @(
            "### Stride ${{ steps.version.outputs.version }} for Windows x64",
            "",
            "- Installers: ``${{ steps.version.outputs.setup_name }}``, ``${{ steps.version.outputs.msi_name }}``",
            "- In-app updates (latest.json windows-x86_64): $(if ($env:UPDATER_SIGNING -eq 'true') { 'yes' } else { 'no (signing secrets not set)' })",
            "- Authenticode: $(if ($env:AUTHENTICODE -eq 'true') { 'signed' } else { 'unsigned (SmartScreen will warn)' })"
          )
          $lines | Add-Content -Path $env:GITHUB_STEP_SUMMARY
